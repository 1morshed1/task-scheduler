# A single-replica Postgres for demo/dev clusters. For production use a managed
# database (RDS/Cloud SQL/etc.) or a proper StatefulSet with real storage and
# backups — this is the "just enough to run the demo" version.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels: { app: postgres }
  template:
    metadata:
      labels: { app: postgres }
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          env:
            - { name: POSTGRES_USER, value: scheduler }
            - { name: POSTGRES_PASSWORD, value: scheduler }
            - { name: POSTGRES_DB, value: taskscheduler }
          ports:
            - containerPort: 5432
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "scheduler", "-d", "taskscheduler"]
            initialDelaySeconds: 5
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
spec:
  selector: { app: postgres }
  ports:
    - port: 5432
      targetPort: 5432
