# The database connection string, shared by server and workers.
#
# DEMO VALUE ONLY. In production, do not commit a real secret to git — create it
# out-of-band (kubectl create secret, an external secrets operator, sealed
# secrets, your cloud's secret manager, etc.). This file exists so the manifests
# are runnable end-to-end in a throwaway cluster.
apiVersion: v1
kind: Secret
metadata:
  name: scheduler-db
type: Opaque
stringData:
  DATABASE_URL: postgres://scheduler:scheduler@postgres:5432/taskscheduler?sslmode=disable
