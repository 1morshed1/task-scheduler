# docker-compose brings up the whole system locally with one command:
#   docker compose up --build
#
# It starts Postgres, one server (API + dashboard + reaper), and three workers —
# so you can watch tasks get spread across a real worker pool. Open the dashboard
# at http://localhost:8080.

services:
  # ---- PostgreSQL: storage + queue + coordination (docs/01) ----
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: scheduler
      POSTGRES_DB: taskscheduler
    ports:
      - "5432:5432"
    # healthcheck lets the other services wait until Postgres is actually ready
    # to accept connections (see `depends_on: condition: service_healthy`).
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d taskscheduler"]
      interval: 3s
      timeout: 3s
      retries: 10
    volumes:
      - pgdata:/var/lib/postgresql/data

  # ---- Server: API + dashboard + reaper ----
  server:
    build: .
    command: ["/app/server"]
    environment:
      DATABASE_URL: postgres://scheduler:scheduler@postgres:5432/taskscheduler?sslmode=disable
      HTTP_ADDR: ":8080"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    # The server auto-migrates on boot, so a fresh volume is set up automatically.

  # ---- Workers: the task-executing pool. `--scale worker=N` for more. ----
  worker:
    build: .
    command: ["/app/worker"]
    environment:
      DATABASE_URL: postgres://scheduler:scheduler@postgres:5432/taskscheduler?sslmode=disable
      WORKER_CONCURRENCY: "5"
      HEARTBEAT_INTERVAL: "10s"
      LOCK_TTL: "30s"
    depends_on:
      postgres:
        condition: service_healthy
      server:
        condition: service_started
    # Give SIGTERM time to drain in-flight tasks before compose SIGKILLs.
    stop_grace_period: 35s
    deploy:
      replicas: 3

volumes:
  pgdata:
